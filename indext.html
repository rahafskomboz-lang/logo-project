<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل البيانات</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/stayle.css">
</head>

<body>

    <div class="login-card">
        <div class="logo-container">
            <h2>logo</h2>
            <p>تسجيل الدخول للنظام</p>
        </div>


        <div class="input-group">
            <label for="name">الاسم</label>
            <input type="text" id="name" placeholder="أدخل اسمك">
        </div>


        <div class="input-group">
            <label for="email">البريد الإلكتروني (Gmail)</label>
            <input type="email" id="email" placeholder="name@gmail.com">
        </div>

        <div class="input-group">
            <label for="password">كلمة المرور</label>
            <div class="password-container">
                <input type="password" id="password" placeholder="أدخل كلمة المرور">
                <!-- <i class="fa-solid fa-eye-slash toggle-pass"></i> -->
            </div>

            <div class="progress-bar-container">
                <div id="strengthBar"></div>
            </div>
            <p id="strengthText" class="hint-text"></p>
        </div>

        <button onclick="handleLogin()">send</button>


        <p id="result-message" class="result-text"></p>
    </div>

    <script src="scirapt.js"></script>
</body>

</html>
